services:
  db:
    build:
      context: ./db
    container_name: rutas-db
    environment:
      POSTGRES_DB: rutasdb
      POSTGRES_USER: rutasuser
      POSTGRES_PASSWORD: rutaspass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rutasuser -d rutasdb"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
    container_name: rutas-backend
    environment:
      PORT: 3001
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: rutasdb
      DB_USER: rutasuser
      DB_PASSWORD: rutaspass
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: rutas-frontend
    depends_on:
      - backend
    restart: unless-stopped
    expose:
      - "5173"

  nginx:
    build:
      context: ./nginx
    container_name: rutas-nginx
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot_webroot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt

volumes:
  postgres_data:
  certbot_webroot:
  letsencrypt:
